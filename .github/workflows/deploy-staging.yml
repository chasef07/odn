name: Deploy staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloud Build → odn-staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: https://odn-staging-1006405058436.us-east4.run.app
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1006405058436/locations/global/workloadIdentityPools/github-actions/providers/odn-staging
          service_account: odn-deploy@acuity-health-prod.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build, migrate, deploy
        run: |
          gcloud builds submit \
            --project=acuity-health-prod \
            --region=us-east4 \
            --config=cloudbuild.yaml \
            --suppress-logs \
            --service-account=projects/acuity-health-prod/serviceAccounts/odn-deploy@acuity-health-prod.iam.gserviceaccount.com \
            --substitutions="^|^_ENV=staging|_GIT_SHA=${GITHUB_SHA}|_SITE_URL=${SITE_URL}|_VERIFICATION_BASE_URL=${SITE_URL}|_RESEND_FROM_EMAIL=hello@updates.onlinedoctornote.com|_DOCTOR_NAME=Dr. Staging Test|_DOCTOR_CREDENTIALS=MD (staging)|_STRIPE_PRICE_ID=price_1UNGDXPOlfpeoqYjaZUgZLh6|_TELNYX_SMS_ENABLED=false" \
            .
        env:
          SITE_URL: https://odn-staging-1006405058436.us-east4.run.app
