name: Production migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to run against production
        required: true
        type: string
      action:
        description: migrate applies pending files; adopt-prisma copies the Prisma history once, before the first migrate
        required: true
        default: migrate
        type: choice
        options:
          - migrate
          - adopt-prisma

permissions:
  contents: read

concurrency:
  group: production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: ${{ inputs.action }}
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      - name: Adopt the Prisma migration history
        if: ${{ inputs.action == 'adopt-prisma' }}
        run: npx tsx scripts/adopt-prisma-migrations.ts

      - name: Apply pending migrations
        if: ${{ inputs.action == 'migrate' }}
        run: npm run db:migrate
