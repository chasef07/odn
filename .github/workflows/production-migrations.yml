name: Production Prisma Migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to run production migrations
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-prisma-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Prisma migrate deploy
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Check migration status before deploy
        continue-on-error: true
        run: npx prisma migrate status

      - name: Deploy pending migrations
        run: npx prisma migrate deploy

      - name: Check migration status after deploy
        run: npx prisma migrate status
