name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      SUPPRESSIONS_BASE: origin/${{ github.base_ref || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - name: npm run check
        run: npm run check
        env:
          RESEND_FROM_EMAIL: shell-leak@example.test
          NEXT_PUBLIC_SITE_URL: https://shell-leak.example.test
          TELNYX_SMS_ENABLED: 'true'
          INTAKE_VALIDATION_ENFORCED: 'true'
          NODE_ENV: production
          PGSSLMODE: require

  time-zones:
    name: Tests (${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [America/Los_Angeles, Asia/Tokyo]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - name: vitest run
        run: npx vitest run

  postgres:
    name: DB tests on Postgres (${{ matrix.server-tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server-tz: [UTC, Asia/Tokyo]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: odn_test
          TZ: ${{ matrix.server-tz }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/odn_test
      SERVER_TZ: ${{ matrix.server-tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - name: Server default time zone is ${{ matrix.server-tz }}
        run: test "$(psql "$TEST_DATABASE_URL" -Atc 'SHOW TimeZone')" = "$SERVER_TZ"
      - name: npm run test:db
        run: npm run test:db

  db-mutant-modules:
    name: DB mutant modules
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.db }}
      jobs: ${{ steps.list.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect src/db or harness changes
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git diff --quiet "$BASE" HEAD -- src/db scripts/check-db-mutants.mjs; then
            echo "db=false" >> "$GITHUB_OUTPUT"
          else
            echo "db=true" >> "$GITHUB_OUTPUT"
          fi
      - name: List db-tested modules and their shards
        id: list
        run: echo "jobs=$(node scripts/check-db-mutants.mjs --modules)" >> "$GITHUB_OUTPUT"

  db-mutants:
    name: DB mutants (${{ matrix.module }} ${{ matrix.shard }})
    needs: db-mutant-modules
    if: needs.db-mutant-modules.outputs.changed == 'true' && needs.db-mutant-modules.outputs.jobs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.db-mutant-modules.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - name: npm run check:db-mutants
        run: npm run check:db-mutants -- --module ${{ matrix.module }} --shard ${{ matrix.shard }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
