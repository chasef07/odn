<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Cyan circular background -->
  <circle cx="32" cy="32" r="32" fill="#00b8d4"/>

  <!-- White stethoscope -->
  <g stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left earpiece -->
    <circle cx="18" cy="16" r="3" fill="white"/>

    <!-- Right earpiece -->
    <circle cx="46" cy="16" r="3" fill="white"/>

    <!-- Left tube from earpiece down -->
    <path d="M 18 19 Q 18 26, 22 32"/>

    <!-- Right tube from earpiece down -->
    <path d="M 46 19 Q 46 26, 42 32"/>

    <!-- Y-shaped connection -->
    <path d="M 22 32 L 32 38"/>
    <path d="M 42 32 L 32 38"/>

    <!-- Main tube going down -->
    <path d="M 32 38 L 32 48"/>

    <!-- Curve to the right -->
    <path d="M 32 48 Q 38 50, 42 52"/>

    <!-- Chest piece (diaphragm) -->
    <circle cx="48" cy="40" r="7" stroke-width="4"/>
    <circle cx="48" cy="40" r="4.5" fill="#00b8d4" stroke="white" stroke-width="2"/>
  </g>
</svg>
